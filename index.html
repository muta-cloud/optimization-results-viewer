<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="最適化結果の6グラフを切り替えて閲覧するビューア">
  <title>最適化結果グラフビューア</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f4f6f5;
      --surface: #ffffff;
      --text: #18211d;
      --muted: #5f6c65;
      --line: #d8dedb;
      --strong-line: #b8c2bd;
      --active: #176c4a;
      --active-text: #ffffff;
      --accent: #b55b16;
      --focus: #0078d4;
      --sidebar-width: 250px;
      --header-height: 64px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--page);
      color: var(--text);
      font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
      letter-spacing: 0;
    }

    button,
    select,
    a {
      font: inherit;
    }

    button:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 35%, transparent);
      outline-offset: 2px;
    }

    .app-shell {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      grid-template-rows: var(--header-height) minmax(0, 1fr);
      width: 100%;
      height: 100%;
      background: var(--surface);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 22px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #17221d;
      color: #ffffff;
    }

    .brand-mark {
      display: grid;
      grid-template-columns: repeat(2, 7px);
      grid-template-rows: repeat(2, 7px);
      gap: 4px;
      flex: 0 0 auto;
    }

    .brand-mark span {
      width: 7px;
      height: 7px;
      background: #ffffff;
    }

    .brand-mark span:nth-child(2),
    .brand-mark span:nth-child(3) {
      background: #d98a4b;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-copy strong {
      display: block;
      overflow: hidden;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-width: 0;
      padding: 10px 16px 10px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .current {
      min-width: 0;
    }

    #current-title {
      margin: 0;
      overflow: hidden;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
    }

    .action-link,
    .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 8px 13px;
      border: 1px solid var(--strong-line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
    }

    .action-link:hover,
    .action-button:hover {
      border-color: var(--active);
      color: var(--active);
    }

    .sidebar {
      min-height: 0;
      overflow-y: auto;
      padding: 18px 14px 24px;
      border-right: 1px solid var(--line);
      background: #f8faf9;
    }

    .graph-button {
      position: relative;
      width: 100%;
      min-height: 42px;
      margin: 2px 0;
      padding: 8px 12px 8px 17px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .graph-button::before {
      position: absolute;
      top: 9px;
      bottom: 9px;
      left: 0;
      width: 3px;
      background: transparent;
      content: "";
    }

    .graph-button:hover {
      background: #edf2ef;
    }

    .graph-button[aria-current="page"] {
      background: #e3eee8;
      color: #0f563a;
    }

    .graph-button[aria-current="page"]::before {
      background: var(--active);
    }

    .graph-button strong {
      display: block;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
    }

    .mobile-picker {
      display: none;
    }

    .viewer {
      position: relative;
      min-width: 0;
      min-height: 0;
      padding: 8px;
      background: var(--page);
    }

    .viewer-frame {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
    }

    #graph-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #ffffff;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      transition: opacity 160ms ease;
    }

    .loading[hidden] {
      display: none;
    }

    @media (max-width: 820px) {
      :root {
        --header-height: auto;
      }

      .app-shell {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto auto minmax(0, 1fr);
      }

      .brand {
        min-height: 54px;
        padding: 8px 16px;
        border-right: 0;
      }

      .topbar {
        grid-row: 2;
        flex-wrap: wrap;
        gap: 9px 12px;
        padding: 10px 12px;
      }

      .current {
        width: 100%;
      }

      #current-title {
        font-size: 17px;
        white-space: normal;
      }

      .mobile-picker {
        display: block;
        flex: 1 1 210px;
        min-width: 0;
        height: 42px;
        padding: 7px 34px 7px 11px;
        border: 1px solid var(--strong-line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        font-size: 14px;
        font-weight: 700;
      }

      .top-actions {
        margin-left: auto;
      }

      .action-button {
        display: none;
      }

      .sidebar {
        display: none;
      }

      .viewer {
        grid-row: 3;
        padding: 5px;
      }

      .viewer-frame {
        border-radius: 4px;
      }
    }

    @media (max-width: 480px) {
      .action-link {
        min-height: 42px;
        padding-inline: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="brand">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
      <div class="brand-copy">
        <strong>最適化結果</strong>
      </div>
    </header>

    <section class="topbar" aria-labelledby="current-title">
      <div class="current">
        <h1 id="current-title"></h1>
      </div>

      <select id="mobile-picker" class="mobile-picker" aria-label="表示するグラフを選択"></select>

      <div class="top-actions">
        <a id="open-direct" class="action-link" href="graphs/all-methods.html" target="_blank" rel="noopener">個別表示</a>
        <button id="fullscreen-button" class="action-button" type="button">全画面</button>
      </div>
    </section>

    <nav id="sidebar" class="sidebar" aria-label="グラフ切り替え"></nav>

    <section class="viewer" aria-label="選択した6グラフ">
      <div id="viewer-frame" class="viewer-frame">
        <iframe id="graph-frame" title="選択した最適化結果グラフ"></iframe>
        <div id="loading" class="loading" role="status" aria-live="polite">グラフを読み込んでいます</div>
      </div>
    </section>
  </main>

  <script>
    const graphs = [
      {
        id: "all-methods",
        title: "3手法比較",
        file: "graphs/all-methods.html"
      },
      {
        id: "magnet-constraint",
        title: "磁石量制約あり",
        file: "graphs/magnet-constraint.html"
      },
      {
        id: "magnet-torque-constraint",
        title: "磁石量・トルク制約あり",
        file: "graphs/magnet-torque-constraint.html"
      },
      {
        id: "feasible-only",
        title: "制約満足のみ",
        file: "graphs/feasible-only.html"
      },
      {
        id: "seed-6",
        title: "シード値6",
        file: "graphs/seed-6.html"
      },
      {
        id: "seed-7",
        title: "シード値7",
        file: "graphs/seed-7.html"
      },
      {
        id: "seed-8",
        title: "シード値8",
        file: "graphs/seed-8.html"
      },
      {
        id: "nonnegative-sparse-pca-seed6",
        title: "Nonnegative Sparse PCA　シード値6",
        file: "graphs/nonnegative-sparse-pca-seed6.html"
      },
      {
        id: "nonnegative-sparse-pca-seed8",
        title: "Nonnegative Sparse PCA　シード値8",
        file: "graphs/nonnegative-sparse-pca-seed8.html"
      }
    ];

    const graphById = new Map(graphs.map((graph) => [graph.id, graph]));
    const sidebar = document.getElementById("sidebar");
    const picker = document.getElementById("mobile-picker");
    const frame = document.getElementById("graph-frame");
    const viewerFrame = document.getElementById("viewer-frame");
    const loading = document.getElementById("loading");
    const currentTitle = document.getElementById("current-title");
    const openDirect = document.getElementById("open-direct");
    const fullscreenButton = document.getElementById("fullscreen-button");

    function buildNavigation() {
      graphs.forEach((graph) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "graph-button";
        button.dataset.graphId = graph.id;
        button.innerHTML = `<strong>${graph.title}</strong>`;
        button.addEventListener("click", () => selectGraph(graph.id));
        sidebar.appendChild(button);

        const option = document.createElement("option");
        option.value = graph.id;
        option.textContent = graph.title;
        picker.appendChild(option);
      });
    }

    function selectGraph(id, options = {}) {
      const graph = graphById.get(id) || graphs[0];
      const isSameGraph = frame.dataset.graphId === graph.id;

      document.querySelectorAll(".graph-button").forEach((button) => {
        if (button.dataset.graphId === graph.id) {
          button.setAttribute("aria-current", "page");
        } else {
          button.removeAttribute("aria-current");
        }
      });

      picker.value = graph.id;
      currentTitle.textContent = graph.title;
      openDirect.href = graph.file;
      frame.title = graph.title;

      if (!isSameGraph) {
        loading.hidden = false;
        frame.dataset.graphId = graph.id;
        frame.src = graph.file;
      }

      if (!options.skipHistory && window.location.hash !== `#${graph.id}`) {
        history.replaceState(null, "", `#${graph.id}`);
      }
    }

    picker.addEventListener("change", (event) => selectGraph(event.target.value));

    frame.addEventListener("load", () => {
      loading.hidden = true;
    });

    fullscreenButton.addEventListener("click", async () => {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await viewerFrame.requestFullscreen();
        }
      } catch (error) {
        console.warn("Fullscreen request was not available.", error);
      }
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenButton.textContent = document.fullscreenElement ? "全画面を終了" : "全画面";
    });

    window.addEventListener("hashchange", () => {
      selectGraph(window.location.hash.slice(1), { skipHistory: true });
    });

    buildNavigation();
    selectGraph(window.location.hash.slice(1) || graphs[0].id, { skipHistory: true });
  </script>
</body>
</html>
